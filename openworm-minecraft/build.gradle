// NOTE: this file could NOT be executed in the authoring sandbox (maven.fabricmc.net / libraries.minecraft.net blocked).
// Versions are the usual Fabric 1.20.1 set; adjust if Loom reports a mismatch.
plugins { id 'fabric-loom' version '1.6-SNAPSHOT'; id 'java' }
version = project.mod_version
group = 'com.openwormmc'
base { archivesName = 'openworm-minecraft' }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation 'junit:junit:4.13.2'
}
tasks.withType(JavaCompile).configureEach { options.release = 17 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
test { useJUnit() }
